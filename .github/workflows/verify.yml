name: Solana sBPF Suite Reproducible Build & Verification CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Solana CLI Tools
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v2.0.14/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Run Program Unit Tests
        run: |
          cd custom_suite
          cargo test --workspace

      - name: Verify Neodyme security.txt Standards
        run: |
          python3 verify_security_txt.py

      - name: Verify Deterministic sBPF Builds
        run: |
          python3 verify_builds.py
