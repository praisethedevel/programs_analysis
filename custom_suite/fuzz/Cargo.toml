[package]
name = "fuzz"
version = "0.1.0"
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
custom_token = { path = "../custom_token" }
custom_sysclock = { path = "../custom_sysclock" }
custom_ram = { path = "../custom_ram" }

[[bin]]
name = "fuzz_custom_token"
path = "fuzz_targets/fuzz_custom_token.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_custom_sysclock"
path = "fuzz_targets/fuzz_custom_sysclock.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_custom_ram"
path = "fuzz_targets/fuzz_custom_ram.rs"
test = false
doc = false
bench = false
